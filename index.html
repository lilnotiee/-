/* SNOW */
const container = document.querySelector(".snow");
const symbols = ["❅",];

function snowflake() {
    const flake = document.createElement("span");

    flake.textContent = symbols[Math.floor(Math.random() * symbols.length)];

    // Small snowflakes
    const size = Math.random() * 8 + 8; // 4–8px

    const startX = Math.random() * window.innerWidth;
    const duration = Math.random() * 5000 + 9000;
    const drift = (Math.random() - 0.5) * 90;

    flake.style.cssText = `
        position: fixed;
        left: ${startX}px;
        top: -20px;
        font-size: ${size}px;
        color: #000000;
        opacity: 1;
        text-shadow: 0 0 1px #000;
        pointer-events: none;
        user-select: none;
        will-change: transform;
        z-index: 9999;
    `;

    container.appendChild(flake);

    const start = performance.now();

    function animate(now) {
        const t = Math.min((now - start) / duration, 1);

        const y = t * (window.innerHeight + 40);
        const x = startX + Math.sin(t * Math.PI * 6) * 10 + drift * t;
        const rotate = t * 360;

        flake.style.transform =
            `translate3d(${x - startX}px, ${y}px, 0) rotate(${rotate}deg)`;

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            flake.remove();
        }
    }

    requestAnimationFrame(animate);
}

setInterval(snowflake, 1000);

let currentSong = 0;
let spotifyActive = false;
let spotifyInterval = null;

const audio = document.getElementById("audioPlayer");
const volumeControl = document.getElementById("volumeControl");
const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const songCover = document.getElementById("songCover");
const playBtn = document.getElementById("playBtn");
const progressBar = document.getElementById("progressBar");
const progressContainer = document.querySelector(".progress-container");
const elapsedEl = document.getElementById("elapsed");
const durationEl = document.getElementById("duration");
const spotifyHeader = document.getElementById("spotifyHeader");

audio.preload = "auto";

if (volumeControl) {
    audio.volume = Number(volumeControl.value);
    volumeControl.addEventListener("input", () => {
        audio.volume = Number(volumeControl.value);
    });
}

function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${minutes}:${secs}`;
}

function loadSong(index) {
    if (!songs[index]) return;

    currentSong = index;
    spotifyActive = false;
    clearInterval(spotifyInterval);

    const song = songs[index];

    audio.pause();
    audio.src = song.src;

    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;
    songCover.src = song.cover;

    progressBar.style.width = "0%";
    elapsedEl.textContent = "0:00";
    durationEl.textContent = "0:00";
    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

    if (spotifyHeader) spotifyHeader.style.display = "none";

    if (typeof updateTheme === "function") {
        try { updateTheme(song.cover); } catch (e) {}
    }

    audio.load();
}

async function playCurrentSong() {
    if (spotifyActive) return;

    try {
        await audio.play();
    } catch (error) {
        console.error("Playback failed:", error);
    }
}

function togglePlay() {
    if (spotifyActive) return;

    if (audio.paused) {
        playCurrentSong();
    } else {
        audio.pause();
    }
}

async function nextSong() {
    if (spotifyActive) return;

    const next = (currentSong + 1) % songs.length;
    loadSong(next);
    await playCurrentSong();
}

async function prevSong() {
    if (spotifyActive) return;

    const previous = (currentSong - 1 + songs.length) % songs.length;
    loadSong(previous);
    await playCurrentSong();
}

audio.addEventListener("play", () => {
    if (!spotifyActive) {
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    }
});

audio.addEventListener("pause", () => {
    if (!spotifyActive) {
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    }
});

audio.addEventListener("ended", () => {
    if (!spotifyActive) {
        nextSong();
    }
});

audio.addEventListener("loadedmetadata", () => {
    if (!spotifyActive && Number.isFinite(audio.duration)) {
        durationEl.textContent = formatTime(audio.duration);
    }
});

audio.addEventListener("timeupdate", () => {
    if (spotifyActive || !Number.isFinite(audio.duration) || audio.duration <= 0) return;

    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = `${percent}%`;
    elapsedEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener("error", () => {
    if (!spotifyActive) {
        console.error("Unable to load:", songs[currentSong]?.src);
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    }
});

if (progressContainer) {
    progressContainer.addEventListener("click", (event) => {
        if (spotifyActive || !Number.isFinite(audio.duration) || audio.duration <= 0) return;

        const rect = progressContainer.getBoundingClientRect();
        const ratio = Math.max(
            0,
            Math.min(1, (event.clientX - rect.left) / rect.width)
        );

        audio.currentTime = ratio * audio.duration;
    });
}

/* ===========================
   DISCORD / SPOTIFY STATUS
   =========================== */

function restoreLocalSong() {
    spotifyActive = false;
    clearInterval(spotifyInterval);

    if (spotifyHeader) spotifyHeader.style.display = "none";

    loadSong(currentSong);
}

function enableSpotify() {
    const data = window.spotifyData;

    if (!data) {
        if (spotifyActive) restoreLocalSong();
        return;
    }

    spotifyActive = true;
    audio.pause();
    clearInterval(spotifyInterval);

    if (spotifyHeader) spotifyHeader.style.display = "flex";

    songTitle.textContent = data.song || "Spotify";
    songArtist.textContent = data.artist || "";

    if (data.album_art_url) {
        songCover.src = data.album_art_url;
    } else if (data.album_art) {
        songCover.src = `https://i.scdn.co/image/${data.album_art}`;
    }

    const startTime = data.timestamps?.start;
    const endTime = data.timestamps?.end;

    function updateSpotifyProgress() {
        if (!spotifyActive) return;

        if (!startTime || !endTime) {
            elapsedEl.textContent = "0:00";
            durationEl.textContent = "0:00";
            progressBar.style.width = "0%";
            return;
        }

        const total = Math.max(0, endTime - startTime);
        const elapsed = Math.max(
            0,
            Math.min(Date.now() - startTime, total)
        );

        progressBar.style.width =
            `${total > 0 ? (elapsed / total) * 100 : 0}%`;

        elapsedEl.textContent = formatTime(elapsed / 1000);
        durationEl.textContent = formatTime(total / 1000);
    }

    updateSpotifyProgress();
    spotifyInterval = setInterval(updateSpotifyProgress, 1000);
}

/* Start with the first exact song, but do not autoplay. */
loadSong(0);

document.querySelectorAll(".glass").forEach(card=>{

    card.addEventListener("mousemove",e=>{

        const rect=card.getBoundingClientRect();

        const x=((e.clientX-rect.left)/rect.width-.5)*8;
        const y=((e.clientY-rect.top)/rect.height-.5)*8;

        card.style.transform=
            `perspective(900px)
             rotateX(${-y}deg)
             rotateY(${x}deg)
             translateY(-2px)`;

    });

    card.addEventListener("mouseleave",()=>{

        card.style.transform=
            "perspective(900px) rotateX(0) rotateY(0)";

    });

});
